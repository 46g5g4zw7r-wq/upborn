<style>
/* Layout: a life record — passport data page on the left, the year being lived in the middle, the way out (Canada) on the right; stacks on phones with the current year first. */
:root{
  --paper:#E5E9E6; --sheet:#F6F8F6; --ink:#111915; --muted:#55625C; --line:#C6CFCA;
  --accent:#2B3FC4; --accent-ink:#FFFFFF; --accent-soft:rgba(43,63,196,.10);
  --good:#1C7748; --warn:#9E600C; --bad:#B42318;
  --f-display:'Unbounded',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C110F; --sheet:#141B18; --ink:#E2E8E4; --muted:#8D9B94; --line:#28332E;
  --accent:#8E9CFF; --accent-ink:#0C110F; --accent-soft:rgba(142,156,255,.14);
  --good:#5BC48C; --warn:#E2A54B; --bad:#F27B6F; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C110F; --sheet:#141B18; --ink:#E2E8E4; --muted:#8D9B94; --line:#28332E;
  --accent:#8E9CFF; --accent-ink:#0C110F; --accent-soft:rgba(142,156,255,.14);
  --good:#5BC48C; --warn:#E2A54B; --bad:#F27B6F; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.app{max-width:1180px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px;flex-wrap:wrap}
.hlive{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--muted);margin-left:auto;margin-right:4px}
.hl{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hl b{color:var(--ink);font-size:14px;font-weight:600}
.hdot{width:7px;height:7px;border-radius:50%;display:inline-block}
.hdot.b{background:var(--good);animation:ping 1.2s infinite}
.hdot.d{background:var(--muted)}
@media (max-width:560px){.hlive{order:3;width:100%;margin:0;justify-content:flex-start}}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{display:block;height:36px;width:auto;max-width:100%}
.brand small{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-size:13px;color:var(--muted)}
.newlife{background:#2563EB;border:1px solid #2563EB;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;color:#fff}
.newlife:hover{background:#1D4ED8;border-color:#1D4ED8}
.lang{font-size:13px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);margin-right:8px}
html[lang=ar] body{font-family:'Noto Sans Arabic',system-ui,sans-serif}
html[lang=bn] body{font-family:'Noto Sans Bengali',system-ui,sans-serif}
html[lang=hi] body{font-family:'Noto Sans Devanagari',system-ui,sans-serif}
html[lang=zh] body{font-family:'Noto Sans SC',system-ui,sans-serif}
.ghost:hover{color:var(--ink);border-color:var(--ink)}

/* start */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;align-items:end;padding-block:28px 12px}
.hero h1{font:700 clamp(30px,5.4vw,60px)/1.02 var(--f-display);letter-spacing:-.025em;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:18px 0 0;max-width:52ch;color:var(--muted);font-size:16px}
.odds{border-top:2px solid var(--ink)}
.odds h3{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 10px}
.oddrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.oddrow b{font-weight:600}
.oddbar{grid-column:2/4;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.oddbar i{display:block;height:100%;background:var(--ink)}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 14px}
.mode{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:10px 14px;text-align:left;min-width:0;flex:1 1 200px}
.mode b{display:block;font-weight:600}
.mode span{font-size:13px;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:14px 22px;font:600 16px/1 var(--f-body)}
.primary:hover{filter:brightness(1.08)}
.primary:disabled{opacity:.4;cursor:not-allowed}
.secondary{background:none;border:1px solid var(--ink);border-radius:8px;padding:13px 18px;font-weight:600}
.secondary:disabled{opacity:.35;cursor:not-allowed}
.note{font-size:13px;color:var(--muted)}

/* game grid */
.grid{display:grid;gap:16px;grid-template-columns:300px minmax(0,1fr) 300px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:1060px){.grid{grid-template-columns:300px minmax(0,1fr)}.col-r{grid-column:1}.col-m{grid-row:1 / span 2;grid-column:2}}
@media (max-width:700px){.grid{display:flex;flex-direction:column}.col{display:contents}
  .card{width:100%;max-width:100%}
  .pass{order:1}.turn{order:2}.ladder{order:3}.stats{order:4}.routes{order:5}.feed{order:6}
  .hero{grid-template-columns:minmax(0,1fr);gap:24px}}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.label{font:600 10.5px/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card h2{font:700 15px/1.2 var(--f-display);margin:0;letter-spacing:-.01em}

/* passport */
.pass{padding:0;overflow:hidden}
.pass-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.pass-body{padding:14px 16px 12px}
.pname{font:700 21px/1.1 var(--f-display);letter-spacing:-.015em;margin:6px 0 2px;overflow-wrap:anywhere}
.pplace{color:var(--muted);font-size:13.5px}
.fields{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin-top:14px;font-size:13.5px}
.fields dt{color:var(--muted)}
.fields dd{margin:0;text-align:right;font-weight:500;min-width:0;overflow-wrap:anywhere}
.mrz{font:400 11.5px/1.45 var(--f-mono);letter-spacing:.12em;padding:10px 16px;border-top:1px dashed var(--line);color:var(--muted);white-space:nowrap;overflow:hidden}
.stamp{display:inline-block;font:600 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:4px;padding:4px 6px;color:var(--accent);transform:rotate(-3deg)}
.stamp.bad{color:var(--bad)}

/* ladder */
.rungs{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.rung{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;font-size:13px;color:var(--muted)}
.rung .n{font:600 12px/1 var(--f-mono)}
.rung .tags{display:flex;gap:4px}
.tag{font:600 10px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border-radius:3px;padding:3px 5px;border:1px solid var(--line);color:var(--muted)}
.rung.here{background:var(--ink);color:var(--paper)}
.rung.here .tag{border-color:var(--paper);color:var(--paper)}
.rung.passed{color:var(--ink)}
.ladder-foot{margin-top:10px;font-size:12.5px;color:var(--muted)}

/* stats */
.bars{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:4px 8px;font-size:13px}
.bar .v{text-align:right;font:600 12px/1.5 var(--f-mono)}
.track{grid-column:1/3;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .4s}
.track i.low{background:var(--bad)}
.talents{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}

/* turn */
.turn{padding:20px}
.turn-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.age{font:700 clamp(26px,3.6vw,38px)/1 var(--f-display);letter-spacing:-.02em}
.year{font:500 13px/1 var(--f-mono);color:var(--muted)}
.this-year{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.this-year li{padding:10px 12px;border-radius:8px;background:var(--paper);font-size:14.5px;border-left:3px solid var(--line)}
.this-year li.good{border-left-color:var(--good)}
.this-year li.bad{border-left-color:var(--bad)}
.this-year li.key{border-left-color:var(--accent)}
.this-year li.info{border-left-color:var(--warn)}
.decision{margin-top:18px;border:1.5px solid var(--ink);border-radius:10px;padding:16px}
.decision p{margin:0 0 14px;font-size:16px;font-weight:500;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block;font-weight:600}
.opt span{font-size:13px;color:var(--muted)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.focus{margin-top:20px}
.focus-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
@media (max-width:460px){.chips{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fchip{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:10px 12px;text-align:left;min-width:0}
.fchip b{display:block;font-weight:600;font-size:14px}
.fchip span{font-size:12px;color:var(--muted)}
.fchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.fchip:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

/* routes */
.route{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.route h3{margin:0;font-size:14.5px;font-weight:600}
.route p{margin:4px 0 8px;font-size:13px;color:var(--muted)}
.reqs{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13px}
.reqs li{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:6px}
.reqs li::before{content:"✕";color:var(--bad);font-weight:700}
.reqs li.ok::before{content:"✓";color:var(--good)}
.reqs li .mono{color:var(--muted);font-size:12px}
.route .primary{padding:10px 14px;font-size:14px;width:100%}
.oddsline{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.track-ca{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:12px}
.track-ca div{font-size:11.5px;text-align:center;padding:8px 2px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.track-ca div.done{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* feed */
.feed-list{list-style:none;margin:12px 0 0;padding:0;max-height:560px;overflow:auto}
.feed-list li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.feed-list .a{font:600 12px/1.6 var(--f-mono);color:var(--muted)}
.feed-list p{margin:0}
.feed-list .key p{font-weight:600}
.feed-list .bad p{color:var(--bad)}
.feed-list .good p{color:var(--good)}

/* end */
.record{border:2px solid var(--ink);border-radius:12px;padding:20px;background:var(--sheet)}
.verdict{font:700 clamp(24px,3.4vw,34px)/1.05 var(--f-display);letter-spacing:-.02em;margin:10px 0 6px;text-wrap:balance}
.verdict.win{color:var(--accent)}
.route-flags{font-size:15px;color:var(--muted)}
.climb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 0}
.climb div{border:1px solid var(--line);border-radius:8px;padding:10px}
.climb b{display:block;font:700 26px/1 var(--f-display)}
.climb span{font-size:12px;color:var(--muted)}
.moments{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.tally{margin-top:14px;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px}
@media (prefers-reduced-motion:reduce){.track i{transition:none}}

/* passports */
:root{--pp-NG:#1C5A3B;--pp-IN:#1E2B5C;--pp-CA:#152846;--pp-CN:#5A1A22;--pp-PK:#1B4D2E;--pp-ID:#1F4A4F;--pp-CD:#203A6B;--pp-ET:#22305A;--pp-BD:#1C4A3A;--pp-US:#1C2B4A;--pp-AU:#1E2F55;--pp-DE:#4A1E22;--pp-RU:#2B3A67;--pp-UZ:#1F5C7A;--pp-AM:#4A2430;--pp-AF:#2F3B2A;--pp-SD:#1E4D3B;--pp-YE:#5C3A1E;--pp-HT:#1D3F7A;--pp-MM:#3D4A1E;--pp-SO:#1F4E6E;--pp-MG:#2E5A3A;--pp-NE:#5E4A1A;--pp-ML:#3A5A2B;--pp-EG:#4A3A1F;--pp-PH:#1F3F6E;--pp-KE:#3B2E5C;--pp-GH:#2E4A2A;--pp-UK:#2A1F4A;--pp-gold:#E3C377;--pp-paper:#F3ECD8;--pp-paper2:#E4D8B9;--pp-ink:#2A2418}
.pp{position:relative;width:min(230px,62vw);aspect-ratio:.7;margin:18px auto 4px;perspective:1400px}
.pp-page,.pp-cover{position:absolute;inset:0;border-radius:8px 14px 14px 8px}
.pp-page{background:linear-gradient(160deg,var(--pp-paper),var(--pp-paper2));color:var(--pp-ink);padding:12px 12px 10px;text-align:left;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:8px}
.pp-page::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 70% 30%,rgba(120,90,40,.06) 0 2px,transparent 2px 9px);pointer-events:none}
.pp-top{display:flex;justify-content:space-between;font:700 8.5px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.pp-photo{display:grid;grid-template-columns:62px minmax(0,1fr);gap:9px;align-items:start}
.pp-photo svg{width:62px;height:78px;border-radius:3px;background:#CFC4A6}
.pp-f{font-size:10.5px;line-height:1.3;min-width:0}
.pp-f i{display:block;font-style:normal;font:600 7.5px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;opacity:.6;margin-top:3px}
.pp-f b{display:block;font-weight:600;font-size:11.5px;overflow-wrap:anywhere}
.pp-mrz{margin-top:auto;font:500 7.6px/1.35 var(--f-mono);letter-spacing:.06em;white-space:nowrap;overflow:hidden;opacity:.8}
.pp-cover{background:radial-gradient(120% 80% at 30% 20%,rgba(255,255,255,.12),transparent 60%),var(--pc);transform-origin:left center;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:20px 12px 18px;color:var(--pp-gold);text-align:center;box-shadow:inset 6px 0 10px rgba(0,0,0,.35),0 14px 34px rgba(0,0,0,.45)}
.pp-cover .t1{font:700 10.5px/1.35 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.pp-cover .t2{font:600 9px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.pp-cover .pt{font:700 15px/1.2 var(--f-display);letter-spacing:.14em}
.pp-cover svg{width:74px;height:74px}
.pp.in{animation:ppin .75s cubic-bezier(.2,1.25,.3,1) both}
.pp.open .pp-cover{animation:ppopen 1.1s .75s cubic-bezier(.6,.05,.3,1) forwards}
.pp.opened .pp-cover{display:none}
.pp.out{animation:ppout .7s ease-in forwards}
@keyframes ppin{from{transform:translateY(46px) rotate(-9deg) scale(.82);opacity:0}}
@keyframes ppopen{to{transform:rotateY(-165deg);opacity:0;visibility:hidden}}
@keyframes ppout{to{transform:translateX(-150%) rotate(-16deg);opacity:0}}
.pp-stamp{position:absolute;right:8px;top:46%;font:800 13px/1.05 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#C0283E;border:3px solid currentColor;border-radius:7px;padding:7px 9px;transform:rotate(-12deg);background:rgba(243,236,216,.55);animation:slam .55s .35s cubic-bezier(.2,1.6,.4,1) both;max-width:80%;text-align:center}
.pp-stamp.ok{color:#1F7A47}
.pp-swap{position:relative;height:calc(min(230px,62vw)/.7 + 24px)}
.pp-swap .pp{position:absolute;left:0;right:0;margin:0 auto}
.pp-mini{display:inline-block;width:14px;height:19px;border-radius:2px 3px 3px 2px;vertical-align:-4px;margin-right:8px;box-shadow:inset 2px 0 2px rgba(0,0,0,.35)}
.vf{display:inline-flex;gap:8px;align-items:baseline;margin-top:8px;font-size:14px;color:var(--ov-muted)}
.vf b{font:700 26px/1 var(--f-display);color:var(--ov-gold)}
@media (prefers-reduced-motion:reduce){.pp.in,.pp.out,.pp-stamp{animation:none}.pp.open .pp-cover{animation:none;display:none}}




/* ===== v0.7 health ===== */
.track{position:relative}
.capm{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bad);border-radius:1px}
.bar .cap{font-style:normal;font-size:11.5px;color:var(--muted)}
.ills{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.ill{font-size:12px;border:1px solid var(--bad);color:var(--bad);border-radius:999px;padding:2px 9px}
.ill.grave{background:var(--bad);color:var(--sheet)}
/* ===== v0.6 luck & illegal ===== */
.lk,.lk-t{text-align:left}
.ov .fin-actions .primary,.ov .fin-actions .ghost,.ov .fin-actions .danger{margin-top:0}
.fin-actions{align-items:center}
.luckchip{grid-column:1/-1;margin-top:8px;width:100%;border-style:dashed}
.luckchip[aria-pressed="true"]{border-style:solid;border-color:var(--ov-gold,#FFC94D);background:rgba(255,201,77,.14);box-shadow:inset 0 0 0 1px #E0A91F}
.fchip.off{opacity:.45}
.lk-list{display:flex;flex-direction:column;gap:8px;margin:16px 0 4px;text-align:left}
.lk{display:grid;grid-template-columns:4.2em minmax(0,1fr);grid-template-rows:auto 6px;gap:6px 12px;align-items:center;background:rgba(255,255,255,.06);border:1px solid var(--ov-line);color:var(--ov-ink);border-radius:10px;padding:12px 14px}
.lk:hover:not(:disabled){border-color:var(--ov-gold)}
.lk:disabled{opacity:.4;cursor:not-allowed}
.lk-p{grid-row:1/3;font:700 20px/1 var(--f-display);color:var(--ov-gold)}
.lk-t b{display:block;font-weight:600}.lk-t span{font-size:12.5px;color:var(--ov-muted)}
.lk-bar{height:6px;background:var(--ov-line);border-radius:3px;overflow:hidden}.lk-bar i{display:block;height:100%;background:var(--ov-gold)}
.wh svg{width:min(280px,70vw);height:auto;display:block;margin:12px auto 0}
.danger{background:#C0283E;color:#fff;border:0;border-radius:8px;padding:13px 18px;font:600 15px/1 var(--f-body)}
.danger:disabled{opacity:.4;cursor:not-allowed}
.route.illegal{border-top-color:var(--bad)}
.route.illegal .danger{width:100%;padding:10px 14px;font-size:14px}
.ilbadge{display:inline-block;margin-right:8px;font:700 9.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--bad);border-radius:3px;padding:3px 5px;vertical-align:2px}
.risk-bar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:18px 0 8px;gap:2px}
.risk-bar i{display:block;height:100%}
.risk-bar .ok,.risk-legend .ok{background:#5BC48C}.risk-bar .caught,.risk-legend .caught{background:#E2A54B}.risk-bar .die,.risk-legend .die{background:#F27B6F}
.risk-legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:13px;color:var(--ov-ink)}
.risk-legend span{display:inline-flex;align-items:center;gap:6px}.risk-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.risk-list{text-align:left;margin:16px 0 4px;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ov-ink)}

/* ===== v0.5 finale ===== */
.fin{text-align:center}
.candle{position:relative;width:26px;height:74px;margin:0 auto 14px}
.candle .wax{position:absolute;left:4px;bottom:0;width:18px;height:46px;border-radius:4px 4px 2px 2px;background:linear-gradient(90deg,#E9E2D0,#FFF8E8 45%,#D9D0BA)}
.candle .flame{position:absolute;left:7px;top:4px;width:12px;height:22px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#FFF6C8,#FFC94D 45%,#FF8A3D 80%);box-shadow:0 0 22px 8px rgba(255,190,80,.35);transform-origin:50% 90%;animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}30%{transform:scale(1.08,.94) rotate(2deg)}60%{transform:scale(.95,1.06) rotate(-1deg)}}
.fin-name{font:700 clamp(28px,5vw,44px)/1.05 var(--f-display);letter-spacing:-.02em;margin:6px 0 4px}
.fin-dates{font:500 14px/1.4 var(--f-mono);color:var(--ov-muted);margin:4px 0}
.fin-route{font-size:16px;color:var(--ov-ink);margin:2px 0 10px}
.lifechart{width:100%;height:auto;margin:6px 0 2px}
.lc-grid{stroke:var(--ov-line);stroke-width:1}
.lc-lab{fill:var(--ov-muted);font:500 11px var(--f-mono)}
.lc-tag{fill:var(--ov-gold);font:700 12px var(--f-mono)}
.lc-line{fill:none;stroke:var(--ov-ink);stroke-width:2.5;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s .4s ease-out forwards}
.lc-abroad{fill:none;stroke:var(--ov-gold);stroke-width:4;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s 2.2s ease-out forwards}
.lc-area{opacity:0;animation:fade .8s 2.4s forwards reverse;animation-direction:normal}
@keyframes draw{to{stroke-dashoffset:0}}
.lc-area{animation:areain .9s 2.4s forwards}@keyframes areain{to{opacity:1}}
.lc-dot{fill:var(--ov-ink)}.lc-peak{fill:var(--ov-gold)}.lc-end{fill:var(--ov-muted)}
.fin-verdict{font:700 clamp(22px,3.6vw,30px)/1.15 var(--f-display);margin:12px 0 4px;text-wrap:balance;color:var(--ov-ink);animation:rise .6s 2.8s both}
.fin-verdict.win{color:var(--ov-gold)}
.fin-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0;text-align:left;animation:rise .6s 3.1s both}

.fin-facts div{border:1px solid var(--ov-line);border-radius:10px;padding:12px}

.fin-facts span{font-size:12.5px;color:var(--ov-muted)}
.fin-moments{list-style:none;margin:0 0 6px;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ov-ink);animation:rise .6s 3.4s both}
.fin-moments li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px}
.fin-moments span{font:600 12px/1.6 var(--f-mono);color:var(--ov-muted)}
.fin-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.fin-actions .primary,.fin-actions .ghost{margin-top:4px}
@media (prefers-reduced-motion:reduce){.lc-line,.lc-abroad{stroke-dasharray:none;animation:none}.lc-area{opacity:1;animation:none}.fin-verdict,.fin-facts,.fin-moments{animation:none}.candle .flame{animation:none}}

/* ===== v0.4 destinations ===== */
.dtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0 2px}

.sec{padding-block:56px 8px;border-top:2px solid var(--ink);margin-top:48px}

.sec-head p{margin:0;color:var(--muted)}
.sec-label{font:600 11px/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}

.now-big{display:flex;align-items:baseline;gap:12px}

.pills{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 24px}
.pill{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13.5px;background:var(--sheet)}
.pill b{margin-left:4px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:460px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi b{font:700 26px/1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px}
.kpi small{font-size:11.5px;color:var(--muted)}
.chart{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:12px}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}

.db-row,.st-row{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) 6.2em;gap:12px;align-items:center;padding:10px 0}
.db-row.axis{padding:0}
.db-name{font-weight:500;white-space:nowrap}
.db-track{position:relative;height:22px;border-bottom:1px solid var(--line)}
.db-track.bare{border:0;height:16px}

.db-tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}

.db-val{text-align:right;font-size:13.5px}

.st-bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--line);gap:2px}

.foot div:last-child{max-width:56ch}

/* ===== v0.2: scene, overlays, mini-games ===== */
.wrow{display:grid;grid-template-columns:22px minmax(0,7.5em) minmax(0,1fr) 3.6em;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.wrow .wf{font-size:16px;line-height:1}
.wrow .wn{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.wrow .wbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.wrow .wbar i{display:block;height:100%;background:var(--muted);border-radius:4px;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
.wrow.on .wbar i{background:var(--accent)}
.wrow.on .wn{font-weight:600}
.wrow .wv{text-align:right;font-size:13px;color:var(--muted)}
.wtag{font:600 9.5px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:2px 4px}
.wrow:nth-of-type(2) .wbar i{animation-delay:.05s}.wrow:nth-of-type(3) .wbar i{animation-delay:.1s}.wrow:nth-of-type(4) .wbar i{animation-delay:.15s}.wrow:nth-of-type(5) .wbar i{animation-delay:.2s}.wrow:nth-of-type(6) .wbar i{animation-delay:.25s}.wrow:nth-of-type(7) .wbar i{animation-delay:.3s}.wrow:nth-of-type(8) .wbar i{animation-delay:.35s}.wrow:nth-of-type(9) .wbar i{animation-delay:.4s}.wrow:nth-of-type(10) .wbar i{animation-delay:.45s}
@keyframes grow{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.wrow .wbar i{animation:none}}
.live-row{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.live-row b{font:700 clamp(20px,2.6vw,28px)/1 var(--f-display);letter-spacing:-.01em;min-width:0}
.live-row span{font-size:13px;color:var(--muted)}
.playing{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 0;font-size:13.5px;color:var(--muted)}
.playing b{color:var(--ink)}
.playing .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(91,196,140,.6)}100%{box-shadow:0 0 0 8px rgba(91,196,140,0)}}
:root{--ov-bg:rgba(6,10,24,.97);--ov-ink:#F2F4FF;--ov-muted:#AAB4D8;--ov-line:rgba(255,255,255,.16);--ov-gold:#FFC94D;--stamp:#E0445A;--scene-bg:#1B2444}
.scene{position:relative;margin:-20px -20px 18px;height:clamp(190px,25vw,260px);border-radius:10px 10px 0 0;overflow:hidden;background:var(--scene-bg)}
.scene canvas{display:block;width:100%;height:100%}
.scene-tag{position:absolute;left:12px;bottom:10px;font:600 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ov-ink);background:rgba(0,0,0,.4);padding:6px 8px;border-radius:5px}
.this-year li{animation:rise .5s both}
.this-year li:nth-child(2){animation-delay:.12s}.this-year li:nth-child(3){animation-delay:.24s}.this-year li:nth-child(4){animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.age.tick{animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.7);opacity:.2}100%{transform:none;opacity:1}}
.rung.here.climb{animation:climb .8s cubic-bezier(.2,1.2,.3,1)}
.rung.here.fall{animation:fall .8s ease-out}
@keyframes climb{0%{transform:translateY(38px);background:var(--accent)}60%{background:var(--accent)}}
@keyframes fall{0%{transform:translateY(-38px);background:var(--bad)}60%{background:var(--bad)}}
.stamp.slam{animation:slam .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{0%{transform:scale(2.6) rotate(-16deg);opacity:0}100%{transform:rotate(-3deg);opacity:1}}
.hustle{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border:1px dashed var(--line);border-radius:8px}
.hustle .secondary{padding:9px 14px;font-size:14px;white-space:nowrap}
.hustle span{font-size:13px;color:var(--muted)}
.opt .badge{display:inline-block;margin-left:6px;font:600 10px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:3px 5px;border-radius:3px;vertical-align:2px}
/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:var(--ov-bg);color:var(--ov-ink);display:grid;place-items:center;overflow:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.ov-card{width:100%;max-width:580px;text-align:center}
.ov .label{color:var(--ov-muted)}
.ov h2{font:700 clamp(22px,4vw,30px)/1.15 var(--f-display);margin:8px 0 6px;letter-spacing:-.015em;text-wrap:balance}
.ov p{color:var(--ov-muted);margin:6px 0}
.ov .primary{background:var(--ov-gold);color:#141414;margin-top:18px}
.ov .ghost{color:var(--ov-muted);border-color:var(--ov-line);margin-top:12px}
.spin-flag{font-size:64px;line-height:1;height:70px;margin-top:18px}
.spin-name{font:700 clamp(36px,8vw,64px)/1.05 var(--f-display);letter-spacing:-.03em;margin:8px 0;min-height:1.1em}
.spin-name.land{animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
.spin-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px;text-align:left}
.spin-facts div{border:1px solid var(--ov-line);border-radius:8px;padding:10px 12px;font-size:14px}
.spin-facts b{display:block;font:600 10.5px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ov-muted)}
.flight svg{width:100%;height:auto;display:block;margin-top:12px}
.big-stamp{display:inline-block;margin-top:14px;font:700 15px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--stamp);border:3px solid var(--stamp);border-radius:6px;padding:10px 14px;transform:rotate(-6deg);animation:slam .6s cubic-bezier(.2,1.6,.4,1) both}
.big-stamp.ok{color:var(--ov-gold);border-color:var(--ov-gold)}
.game-hud{display:flex;justify-content:space-between;align-items:baseline;font:600 14px/1 var(--f-mono);margin-top:14px}
.game-hud b{font:700 28px/1 var(--f-display);color:var(--ov-gold)}
.game-field{position:relative;margin-top:10px;height:min(52vh,340px);border-radius:12px;overflow:hidden;border:1px solid var(--ov-line);touch-action:manipulation;user-select:none}
.game-field canvas{display:block;width:100%;height:100%;cursor:pointer}
.tbar{height:6px;background:var(--ov-line);border-radius:3px;overflow:hidden;margin-top:12px}
.tbar i{display:block;height:100%;background:var(--ov-gold);transform-origin:left}
.q{font:600 clamp(18px,3vw,22px)/1.3 var(--f-body);margin:18px 0 14px;color:var(--ov-ink);text-wrap:balance}
.qopts{display:grid;gap:8px}
.qopts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.qbtn{background:rgba(255,255,255,.06);border:1px solid var(--ov-line);color:var(--ov-ink);border-radius:9px;padding:13px 14px;text-align:left;font-size:15px}
.qbtn:hover{border-color:var(--ov-gold)}
.qbtn.right{background:rgba(91,196,140,.25);border-color:#5BC48C}
.qbtn.wrong{background:rgba(242,123,111,.22);border-color:#F27B6F}
.officer{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:10px;color:var(--ov-muted);font-size:13px}
@media (prefers-reduced-motion:reduce){.this-year li,.age.tick,.rung.here.climb,.rung.here.fall,.stamp.slam,.spin-name.land,.big-stamp,.ov{animation:none}}

.yearpick{display:grid;gap:6px;margin:6px 0 12px}.yearpick input{width:100%;accent-color:var(--accent,#FFB020)}.yearpick label{font-size:14px}.globe{display:block;margin:10px auto 4px;width:200px;max-width:100%;height:auto}.globe .pulse{animation:gp 1.8s ease-out infinite;transform-origin:100px 100px}@keyframes gp{0%{r:4;opacity:.9}100%{r:22;opacity:0}}
.musicbtn{background:none;border:1px solid currentColor;border-radius:6px;padding:4px 9px;cursor:pointer;color:inherit;font-size:14px;margin-right:6px;opacity:.85}.musicbtn[aria-pressed="false"]{opacity:.4;text-decoration:line-through}
.popyr{font-size:13px;opacity:.85;margin-top:2px}
.famtab{width:100%;border-collapse:collapse;font-size:13px;margin-top:2px}.famtab th{text-align:left;font-weight:400;color:var(--muted);padding:3px 10px 3px 0;white-space:nowrap}.famtab td{text-align:right;padding:3px 0;border-top:1px solid var(--line)}.famnote{margin-top:6px}
.site-foot{margin-top:24px;padding:16px 0;text-align:center;font-size:13px;color:inherit;opacity:.7}.site-foot a{color:inherit}</style>

","childrenTitle":(from, to) => `С ${from} до ${to} лет`},"finale":{"finLabel":"Запись о жизни","finFacts":{"lived":"в среднем {loc} живут {le}","steps":"ступени: старт → пик","odds":"из 100 родившихся там же выбираются","calc":"считаем…"},"finChart":{"step":"ступень","ariaLine":"Путь по лестнице достатка за всю жизнь","peakTag":(n) => `пик · ${n}`},"finMoments":"Главное","finStoryText":"А где родишься ты?","finStoryHeader":"ЗАПИСЬ О ЖИЗНИ","finCopy":(name, home, dest, years, start, peak, verdict) => `Upborn: ${name}, ${home}${dest ? ' → ' + dest : ''}, ${years}. Ступени: ${start} → ${peak}. ${verdict}. А где родишься ты? upborn.app`,"statsNow":"Сейчас в Upborn","statsPeople":(n) => `${n === 1 ? 'человек проживает' : 'человек проживают'} жизнь прямо сейчас`,"statsPlayers":(n) => `по ${n} жизням игроков`,"statsModel":(n) => `модель: ${n} жизней, решения наугад`,"statsKpi":{"lived":"жизней прожито","escaped":"выбрались","avgLife":"лет — средняя жизнь"},"statsKpiSub":{"escaped":"дома или за границей","avgLife":"с учётом детской смертности"},"statsGameVsReal":"Игра и реальный мир","statsDumbTitle":"Средняя продолжительность жизни","statsGame":"в игре","statsReal":"в реальности (ООН)","statsStackTitle":"Чем заканчиваются жизни","statsStackHint":"справа — сколько выбрались","statsLiveNote":"Данные обновляются в реальном времени, как только кто-то заканчивает жизнь.","statsModelNote":"Пока игроков мало, графики строятся по модели: тысячи жизней, где решения принимаются наугад. Когда наберётся 30 жизней игроков — переключимся на них.","statsEmpty":"Нажми «Родиться» — и ты появишься здесь.","statsVerd":{"abroad":"Выбрались за границу","home":"Выбрались дома","up":"Поднялись, но не выбрались","stay":"Остались там же","child":"Не дожили до 18 или погибли в пути"},"statsIntroPeople":"Люди в Upborn","statsIntroSub":"Статистика всех жизней — обновляется сама.","statsHowTitle":"Как устроена игра","statsHowSub":"Одна жизнь — 15–30 минут.","howSteps":[["Лотерея рождения","Страна, се ancerMiracle":"The illness went away on its own. Doctors cannot explain it.","cancerRefused":(s) => `You decided not to treat it. Not much time is left.`,"secondaryPoor":"Primary school is behind you. Money is short, and your father says the family needs hands — ","secondaryRich":"Primary school is behind you. Six years of secondary school ahead.","secondaryStay":"Keep studying","secondaryStaySub":(aff) => aff ? 'The family can afford school fees' : 'No money: parents will try to borrow, 50/50 chance',"secondaryStayLog":"You keep studying.","secondaryNoMoney":"The money never turned up. You had to leave school.","secondaryWork":"Go to work and help the family","secondaryWorkSub":"Life gets easier at home, but without education many doors close","secondaryWorkLog":"You leave school and go to work.","afterText":(age) => age <= 18 ? 'School is finished. What next?' : 'Another try at getting into university?',"parentSickText":(cost) => `Your mother has been diagnosed with a heart condition. The operation costs about $${cost}.`,"parentPay":"Pay for treatment","parentPaySub":(ok) => ok ? 'A large part of your savings' : 'Not enough money — you will have to borrow',"parentPayLog":"The operation went well. Mom is home.","parentNo":"No money for this","parentNoSub":"Hope it works out","parentDied":"Mom is gone.","parentSurvived":"Mom pulled through on her own, but her health is not the same.","scamText":(amt) => `Your neighbour invites you to put $${amt} into a «business» that doubles money in six months.`,"scamInvest":"Invest","scamInvestSub":"He shows you photos of a new car","scamWin":"Lucky: the money really doubled. That is rare.","scamLose":"The scheme collapsed. The neighbour left town, the money is gone.","scamNo":"Refuse","scamNoSub":"Too much like a pyramid scheme","scamNoLog":"Six months later the scheme collapsed. You were not hurt.","siblingText":(who, amt) => `${who} asks for $${amt} for school.`,"siblingGive":"Give money","siblingGiveSub":"The family will remember","siblingGiveLog":"You helped your relatives with their studies.","siblingRefuse":"Refuse","siblingRefuseSub":"You need to save for yourself","siblingRefuseLog":"Your relatives are upset.","friendText":(home) => `An acquaintance ${home ? 'from the neighbourhood' : 'from the community'} invites you over: he needs someone he can rely on.`,"friendYes":"Agree","friendNo":"Refuse","friendNoSub":"Stay where you are","bribeText":"The teacher hints: $50 and the exam is passed.","bribePay":"Pay","bribePaySub":"Many people do it","bribePayLog":"The exam is «passed».","bribeHonest":"Take the exam honestly","bribeHonestSub":"You need about 55 points of knowledge","bribeHonestOk":"You passed on your own. Good feeling.","bribeHonestFail":"You failed. You have to stay another year.","remoteText":"An American startup is looking for a remote assistant. It pays in dollars — many times more than local wages.","remoteYes":"Take it","remoteYesSub":"Night shifts because of the time difference","remoteYesLog":"You now work remotely for clients abroad.","remoteNo":"Refuse","remoteNoSub":"Not sure you can handle it","marryText":(home, female) => home ? `Your parents found you a ${female ? 'groom' : 'bride'} from a good family.` : `You met someone you want to stay with.`,"marryYes":"Get married","marryYesSub":(home) => home ? 'The wedding costs money, but it is easier together' : 'Easier to pay rent together',"marryLog":"Wedding!","marryNo":"Not now","marryNoSub":"First get on your feet","childMarryText":(age) => `Your parents have arranged your marriage. You are ${age}. School will have to end.`,"childMarryRefuse":(p) => ['Refuse and stay in school', `Takes determination · chance to win ≈ ${p}%`],"childMarryRefuseWin":"You stood up for your right to study.","childMarryRefuseLose":"Your refusal was not accepted. The marriage happens, and school is over.","childMarryYes":"Agree","childMarryYesSub":"That is the custom","childMarryYesLog":"Wedding. School is over.","remitText":(loc, amt) => `Your family in ${loc} asks for help: $${amt}.`,"remitSend":"Send money","remitSendSub":(ok) => ok ? 'It is a huge amount for them' : 'You will have to borrow',"remitSendLuck":"With your transfers the family opened a shop and got back on its feet.","remitSendLog":"The money went home.","remitNo":"I cannot this year","remitNoSub":"Things are hard for you too","remitNoLog":"Mom said she understands. It did not make it easier.","conflictText":(urban) => `Fighting has started near the ${urban ? 'city' : 'village'}. Neighbours are packing their things.`,"conflictLeave":"Move to a big city","conflictLeaveSub":"Safer, but you will have to start from zero","conflictLeaveLog":(place) => `The family moved to ${place}. Everything they built stayed behind.`,"conflictStay":"Stay at home","conflictStaySub":"Risky, but the home and the work stay","conflictHit":"The fighting reached your street. You survived by luck, but you are wounded.","conflictMiss":"The fighting passed by. This time.","smugglerText":(dest, route, cost, pOk, pCaught, pDie, asy, gen) => `A friend of a friend offers to smuggle you ${dest}. Route: «${route}». Price $${cost}, paid upfront. Honestly: out of 100 such attempts about ${pOk} get through, ${pCaught} are caught and sent back, ${pDie} die on the way. If you arrive without documents, you can apply for asylum — about ${asy}% of people from ${gen} get it. Everyone else lives without documents and without the right to work.`,"smugglerYes":"Agree","smugglerYesSub":(ok, cost) => ok ? `Pay $${cost} now · there is no going back` : `Not enough money: you need $${cost}. Save up, and the route will open again`,"smugglerYesLog":"You agreed. At night they came for you.","smugglerNo":"Refuse","smugglerNoSub":"Wait for the legal route, even if it is slower","smugglerNoLog":"You turned down the crossing. The legal route is longer, but without the risk.","cancerTreatDebt":" · you will have to borrow","secMarket":"at the market","secField":"in the fields","univExam":"Entrance exam to a public university","univExamSub":(know) => `Around 60 points needed · knowledge ${know} + your exam result`,"univScholar":" · a scholarship covers everything","univPerYear":(n) => ` · $${n}/year`,"univWin":"You got into a public university!","univFail":"Not enough points. You can study harder and try again next year.","univPrivate":"Private university","univPrivScholar":"A scholarship covers the fees","univPrivCost":(n) => `$${n}/year — family will help`,"univPrivNo":(n) => `$${n}/year — not affordable`,"univPrivWin":"You got into a private university.","college":"College: a trade job in 2 years","collegeSub":"Electrician, welder, nurse — jobs come faster","collegeLog":"You start training for a trade.","workNow":"Work right away","workNowSub":"Money now, but a lower ceiling","workNowLog":"You choose work.","sameJobSub":"Same job, just a different place","sameJobLog":"You changed workplace.","cancerTreatSub":(cost, pc, debt) => `$${cost} · chance to recover ≈ ${pc}%${debt ? ' · you will have to borrow' : ''}`,"termTreat":(kind) => `${kind}. The treatment did not help.`,"termNoTreat":(kind) => `${kind}, untreated.`,"newJobSub":(name) => `New job: ${name}`,"newJobLog":(name) => `New job: ${name}.`},"events":{"child":{"1":{"poor":"First steps right on the dirt floor. Mom was happy as if she had won the lottery.","mid":"First steps, holding the edge of the sofa. Mom filmed it on her phone and sent it to the whole family.","rich":"First steps in a new playpen. Your parents filmed a video they later showed to guests."},"2":{"poor":"Birthday: Mom baked a sugar flatbread, and the present was a new shirt from the market. Joy all over the street.","mid":"Birthday: a cream cake and a bright toy car you rolled all over the flat.","rich":"Birthday: a big cake, balloons and your first bicycle, with ribbons."},"3":"Your first long word was \"mama\". Grandma said it was a sign of good luck.","4":{"poor":"A trip to grandma in the village in {loc}. You saw a river for the first time and swam until your lips turned blue.","mid":"A trip to the sea, the first time in your life. Sand in every pocket, and no one wants to go home.","rich":"A family holiday by the sea: a hotel with a pool, photos to remember it, and ice cream every evening."},"5":{"poor":"Kindergarten is the yard where all the kids of the neighbourhood play, and a ball sewn from old rags.","mid":"Kindergarten: friends for life, your first family drawing and a craft for the holiday.","rich":"Kindergarten with English songs and a pool. Your first \"star of the week\" and a certificate."},"6":{"poor":"Birthday: a present of coloured pencils you kept all year. You did not break a single one.","mid":"Birthday: friends from the yard, pies and a board game played until night.","rich":"Birthday: a tablet with cartoons that your parents saved for half a year. Everyone is thrilled."},"7":{"poor":"First day at school. The uniform is your older brother's hand-me-down, and the jacket is two sizes too big. Never mind, you will grow into it.","mid":"First school day: a backpack with dinosaurs, a bouquet for the teacher and pride all day long.","rich":"First grade: a new backpack, a pencil case with a magnet and a photo at the school gate that Mom will hang on the wall."},"8":{"poor":"First trip to the circus in town: a dusty tent and a clown who tricked everyone with candy.","mid":"A trip to the zoo. You stood longer than anyone by the monkey cage.","rich":"A trip to the zoo, then dinner at a café. The waiter brought a sweet surprise for the birthday."},"9":{"poor":"A cold for a week. Fever for three days, the medicine bought on credit. Mom did not sleep, but it passed.","mid":"A cold for a week: Mom brought broth and read books aloud. Being ill turned out to be almost fun.","rich":"A cold for a week: a doctor at home, cartoons on schedule and mountains of sweets from grandma."},"10":{"poor":"Your first friend, with whom you built a hut out of boards on the wasteland. The most important summer of childhood.","mid":"Your first best friend: you built a construction set together and dreamed of opening your own workshop.","rich":"Your first best friend: together you invented a game that the whole class plays."}},"quiet":{"bday":"A birthday on the roof: friends, corn on the coals and fireworks over the yard. There was so much smoke that the neighbours came out to look.","yard":"Football in the yard until dark. The goals are two stones, the ball is made of old plastic bags, and nobody wants to go home.","camp":"Summer camp by the river: tents, night stories by the fire and the first time you left home without your parents.","dance":"A school disco. You asked a classmate to dance a slow one, and the whole evening went to not stepping on her feet.","concert":"A local band plays at a club. Shouting, sweat, and the feeling that life is only beginning.","job1":"Your first side job: delivering orders by bicycle. The first money you earned yourself, and pride all day.","gym":"You joined a gym. Your whole body ached for a week, but afterwards it felt better, in both body and mind.","cook":"You cooked dinner for the whole family yourself. It burned and was too salty, but everyone ate every crumb.","trip":"A trip with friends to a big city: a cheap hostel, late walks and the first night without sleep.","wedding":"A cousin's wedding: dancing until morning, guests from every village and a table that never ends.","mom":"A quiet evening: tea in the kitchen and a talk with Mom about your plans. Sometimes nothing happens, and that matters too.","crush":(name) => `You met ${name}. ${name} goes to the school next door and loves to draw. You talked until night.`,"walk":(dating) => `You and ${dating} take evening walks. Ice cream for two, and being quiet together works too.`,"quarrel":(dating) => `You and ${dating} fought over nothing and made up in one evening. It turned out that this matters too.`,"breakup":(n) => `You and ${n} broke up. For a week you listened to the same songs. Then life moved on.`}},"routes":{"ca-study":{"name":"Study in Canada","desc":"Two years of college, then the right to work and a chance at permanent residence. A Canadian diploma is recognised right away."},"ee":{"name":"Express Entry — points-based PR","desc":"The fastest route: permanent residence straight away. You need a diploma, strong English and work experience."},"agency":{"name":"Work visa through an agency","desc":"The agency promises a job on a farm or in a factory. Fast and no diploma needed, but there are many scams."},"us-study":{"name":"Study in the USA","desc":"A master's at an American university, then up to 3 years of work and the H-1B lottery. Expensive, but the salaries are the highest."},"h1b":{"name":"H-1B work visa","desc":"An American employer enters you in the lottery. You need a diploma, experience and strong English. About 1 in 4 win."},"dv":{"name":"Green Card lottery","desc":"A free lottery: an immediate green card. But citizens of countries that already send many migrants to the USA cannot enter."},"au-study":{"name":"Study in Australia","desc":"Study at an Australian university, then 2–3 years of work and a path to PR through an in-demand occupation."},"au189":{"name":"Skilled Independent — points-based PR","desc":"A points system like Canada's, but the bar is higher: age, diploma, English, experience."},"de-card":{"name":"Opportunity card","desc":"A year in Germany to look for work. You need a profession or a diploma and money in a blocked account."},"bluecard":{"name":"EU Blue Card","desc":"For specialists with a diploma and a job offer. PR after 2 years, an EU passport after 5."},"ausbildung":{"name":"Ausbildung — vocational training","desc":"3 years of training for a trade, directly at a job, with a salary. Possible without a diploma."},"boat-eu":{"name":"Boat across the Mediterranean","desc":"Across the desert to Libya, then a rubber boat to Italy and on to Germany. Thousands of people die on this route every year."},"b ею H-1B в этот раз не попал. Работодатель предлагает попробовать через год.":"You did not win the H-1B lottery this time. The employer suggests trying again next year.","Лотерея Green Card: в этом году не повезло. Шанс около 1 из 25.":"Green Card lottery: no luck this year. The chance is about 1 in 25.","Отказ по карте возможностей: не хватило баллов за образование.":"Refused under the opportunity card: not enough points for education.","Откликался на вакансии весь год — ответили отказом. Нужен ещё опыт или немецкий.":"You applied for jobs all year and got only rejections. You need more experience or German.","Места на Ausbildung в этот раз не нашлось.":"No Ausbildung places were available this time.","Лодку подобрало рыбацкое судно. Тебя чуть не забрало море, но ты выжил":"A fishing boat picked up your boat. The sea nearly took you, but you survived.","Пограничники отпустили тебя: переполненный центр и бумажная волокита. Ты пошёл дальше.":"Border officers let you go: an overcrowded centre and paperwork. You moved on.","Спонсора не нашлось: компании неохотно берут иностранцев. Попробуй через год.":"No sponsor was found: companies are reluctant to hire foreigners. Try again next year.","Инфаркт. Выжил":"Heart attack. You survived.","Инсульт. Долгое восстановление: заново учиться ходить и говорить.":"Stroke. A long recovery: learning to walk and speak again.","Тяжёлая пневмония. Месяц в постели.":"Severe pneumonia. A month in bed.","Туберкулёз. Полгода на таблетках из государственной клиники.":"Tuberculosis. Six months on pills from a public clinic.","Диабет. Теперь лекарства и диета — каждый год и до конца жизни.":"Diabetes. Now medicine and diet, every year for the rest of your life.","Дожди не пришли, урожай погиб. Семья ест один раз в день.":"The rains did not come and the harvest died. The family eats once a day.","Малярия. Неделя жара; лекарства стоили как месяц еды.":"Malaria. A week of fever; the medicine cost as much as a month of food.","Денге после сезона д um's voice on the phone and the smell of her kitchen.","Экзамены сданы — диплом подтверждён. Можно работать по специальности.":"Exams passed and the diploma is recognised. You can work in your field.","Тебя отпустили. Ты снова дома — без денег и без сил.":"You were released. You are home again, without money and without strength.","Туберкулёз вылечен.":"Tuberculosis cured.","Болезнь, которую в богатых странах лечат за неделю.":"An illness that rich countries cure in a week.","Инфекция, до больницы не довезли вовремя.":"An infection; they did not get to hospital in time.","Дорожная авария.":"A road accident.","Сердце. Врача рядом не было.":"The heart. No doctor was nearby.","Рак, найденный слишком поздно.":"Cancer, found too late.","Инфаркт.":"A heart attack.","Старость.":"Old age.","Сердце.":"Heart failure.","Тихо, во сне.":"Quietly, in sleep.","Инфаркт. Скорая не успела.":"A heart attack. The ambulance was too late.","Инсульт.":"A stroke.","Грипп, перешедший в пневмонию.":"Flu that turned into pneumonia.","Пневмония. Организм не справился.":"Pneumonia. The body could not cope.","Туберкулёз — лечение нашли слишком поздно.":"Tuberculosis; treatment was found too late.","Опыт в стране и язык сработали: пришло приглашение на ПМЖ.":"Experience in the country and your language paid off: a permanent residence invitation came.","Очередь на грин-карту наконец дошла.":"Your green card queue finally came through.","Тебе одобрили постоянное жительство.":"Permanent residence was approved for you.","Защита одобрена окончательно.":"Protection was finally granted.","Время работы после учёбы вышло, а H-1B так и не выпала в лотерее.":"Your post-study work time ran out, and the H-1B lottery never came up.","За полтора года после учёбы работу найти не удалось.":"You could not find a job within a year and a half of graduating.","Разрешение на работу закончилось, а ПМЖ не дали.":"Your work permit expired and permanent residence was not granted.","Карта возможностей закончилась, а работы rivada.","college":"Formación profesional: un oficio en 2 años","collegeSub":"Electricista, soldador, enfermera — el trabajo llega antes","collegeLog":"Empiezas a formarte en un oficio.","workNow":"Trabajar ya","workNowSub":"Dinero ahora, pero con techo más bajo","workNowLog":"Eliges trabajar.","sameJobSub":"El mismo trabajo, solo en otro lugar","sameJobLog":"Cambiaste de lugar de trabajo.","cancerTreatSub":(cost, pc, debt) => `$${cost} · probabilidad de curarse ≈ ${pc}%${debt ? ' · tendrás que endeudarte' : ''}`,"termTreat":(kind) => `${kind}. El tratamiento no ayudó.`,"termNoTreat":(kind) => `${kind}, sin tratamiento.`,"newJobSub":(name) => `Nuevo trabajo: ${name}`,"newJobLog":(name) => `Nuevo trabajo: ${name}.`},"events":{"child":{"1":{"poor":"Los primeros pasos, directo sobre el suelo de tierra. Mamá estaba tan contenta como si hubiera ganado la lotería.","mid":"Los primeros pasos, agarrado al borde del sofá. Mamá lo grabó con el móvil y lo mandó a toda la familia.","rich":"Los primeros pasos en un corral nuevo. Tus padres grabaron un video que luego enseñaron a los invitados."},"2":{"poor":"Cumpleaños: mamá horneó una torta de azúcar y el regalo fue una camisa nueva del mercado. Alegría para toda la calle.","mid":"Cumpleaños: una tarta de crema y un coche de juguete brillante que rodaste por todo el piso.","rich":"Cumpleaños: una tarta grande, globos y tu primera bicicleta, con cintas."},"3":"Tu primera palabra larga fue «mamá». La abuela dijo que eso trae buena suerte.","4":{"poor":"Viaje a casa de la abuela, al pueblo en {loc}. Viste un río por primera vez y nadaste hasta que se te pusieron los labios azules.","mid":"Viaje al mar, la primera vez en tu vida. Arena en cada bolsillo y nadie quiere volver a casa.","rich":"Vacaciones en familia junto al mar: un hotel con piscina, fotos para recordar y helado todas las noches."},"5":{"poor":"La guardería es el patio donde juegan todos los niños del barrio, y una pelota cosida con trapos viejos.","mid":"Guardería: a veau travail : ${name}`,"newJobLog":(name) => `Nouveau travail : ${name}.`},"events":{"child":{"1":{"poor":"Les premiers pas, directement sur le sol en terre. Maman était aussi heureuse que si elle avait gagné à la loterie.","mid":"Les premiers pas, en tenant le bord du canapé. Maman a filmé avec son téléphone et envoyé la vidéo à toute la famille.","rich":"Les premiers pas dans un nouveau parc pour bébé. Tes parents ont filmé une vidéo qu’ils ont montrée aux invités."},"2":{"poor":"Anniversaire : maman a cuit une galette au sucre, et le cadeau était une nouvelle chemise du marché. Une joie pour toute la rue.","mid":"Anniversaire : un gâteau à la crème et une voiture jouet colorée que tu as fait rouler dans tout l’appartement.","rich":"Anniversaire : un grand gâteau, des ballons et ton premier vélo, avec des rubans."},"3":"Ton premier long mot a été « maman ». Grand-mère a dit que c’était signe de bonne chance.","4":{"poor":"Voyage chez grand-mère au village {loc}. Tu as vu une rivière pour la première fois et tu t’es baigné{g} jusqu’à avoir les lèvres bleues.","mid":"Voyage à la mer, la première fois de ta vie. Du sable dans chaque poche, et personne ne veut rentrer.","rich":"Vacances en famille au bord de la mer : un hôtel avec piscine, des photos souvenirs et une glace chaque soir."},"5":{"poor":"La maternelle, c’est la cour où jouent tous les enfants du quartier, et un ballon cousu avec de vieux chiffons.","mid":"Maternelle : des amis pour la vie, ton premier dessin de famille et un bricolage pour la fête.","rich":"Maternelle avec des chansons en anglais et une piscine. Ta première « étoile de la semaine » et un diplôme."},"6":{"poor":"Anniversaire : le cadeau était une boîte de crayons de couleur que tu as gardée toute l’année. Pas un seul cassé.","mid":"Anniversaire : des amis de la cour, des tartes et un jeu de société auquel on a joué jusqu’à la nuit.","rich":"Anniversaire : une tablette avec des dessins animés que tes parents ont économisé pendant six mois. feu et la première fois que tu es parti{g} sans tes parents.","dance":"Une boum au lycée. Tu as invité une camarade à danser un slow, et toute la soirée est passée à ne pas lui marcher sur les pieds.","concert":"Concert d’un groupe local dans un club. Des cris, de la sueur et le sentiment que la vie ne fait que commencer.","job1":"Ton premier petit boulot : tu livrais des commandes à vélo. Le premier argent que tu as gagné toi-même, et une fierté pour toute la journée.","gym":"Tu t’es inscrit{g} à la salle de sport. Tout le corps t’a fait mal pendant une semaine, mais ensuite tu t’es senti{g} mieux, dans le corps comme dans la tête.","cook":"Tu as cuisiné le dîner pour toute la famille tout seul. Ça a brûlé et c’était trop salé, mais tout le monde a tout mangé.","trip":"Voyage entre amis dans une grande ville : une auberge bon marché, des balades tardives et la première nuit blanche.","wedding":"Mariage d’un cousin : danse jusqu’au matin, invités de tous les villages et une table qui ne finit jamais.","mom":"Un soir calme : du thé dans la cuisine et une discussion avec maman sur tes projets. Parfois il ne se passe rien, et ça compte aussi.","crush":(name, g) => `Tu as rencontré ${name}. ${name} va dans le lycée d’à côté et adore dessiner. Vous avez parlé jusqu’à la nuit.`,"walk":(dating) => `Toi et ${dating}, vous vous promenez le soir. Une glace à deux, et se taire ensemble, ça marche aussi.`,"quarrel":(dating) => `Toi et ${dating} vous êtes disputés pour rien et réconciliés en une soirée. Il s’avère que ça compte aussi.`,"breakup":(n) => `Toi et ${n}, vous avez rompu. Pendant une semaine tu as écouté les mêmes chansons. Ensuite, la vie a continué.`}},"routes":{"ca-study":{"name":"Étudier au Canada","desc":"Deux ans de collège, puis le droit de travailler et une chance de résidence permanente. Un diplôme canadien est reconnu tout de suite."},"ee":{"name":"Express Entry — résidence par points","desc":"La voie la plus rapide : résidence permanente tout de suite. Il faut un diplôme, un bon anglais et de l’expérience."},"agency":{"name":"Visa de travail par agence","desc":"L’agence promet un travail dans une ferme ou une usine. Rapide et sans diplôme, mais il y a beaucoup d’arnaques."},"us-study":{"name":"Étudier aux États-Unis","desc":"Un master dans une université américaine, puis jusqu’à 3 ans de travail et la loterie H-1B. Cher, mais les salaires sont les plus élevés."},"h1b":{"name":"Visa de travail H-1B","desc":"Un employeur américain t’inscrit à la loterie. Il faut un diplôme, de l’expérience et un bon anglais. Environ 1 sur 4 gagne."},"dv":{"name":"Loterie de la green card","desc":"Une loterie gratuite : green card immédiate. Mais les citoyens des pays qui envoient déjà beaucoup de migrants aux États-Unis ne peuvent pas participer."},"au-study":{"name":"Étudier en Australie","desc":"Des études dans une université australienne, puis 2 à 3 ans de travail et une voie vers la résidence permanente par un métier recherché."},"au189":{"name":"Skilled Independent — résidence par points","desc":"Un système de points comme au Canada, mais la barre est plus haute : âge, diplôme, anglais, expérience."},"de-card":{"name":"Carte des opportunités","desc":"Une année en Allemagne pour chercher du travail. Il faut un métier ou un diplôme et de l’argent sur un compte bloqué."},"bluecard":{"name":"Carte bleue européenne","desc":"Pour les spécialistes avec un diplôme et une offre d’emploi. Résidence permanente après 2 ans, passeport de l’UE après 5."},"ausbildung":{"name":"Ausbildung — formation professionnelle","desc":"3 ans de formation à un métier, directement sur le lieu de travail et avec un salaire. Possible sans diplôme."},"boat-eu":{"name":"Bateau à travers la Méditerranée","desc":"À travers le désert jusqu’en Libye, puis un canot pneumatique vers l’Italie et ensuite l’Allemagne. Des milliers de personnes meurent chaque année sur cette route."},"border-us":{"name":"Traverser la frontière vers les États-Unis","desc":"Un long chemin à t абрало море, но ты выжил":"Un bateau de pêche a recueilli ton embarcation. La mer a failli t’emporter, mais tu as survécu.","Пограничники отпустили тебя: переполненный центр и бумажная волокита. Ты пошёл дальше.":"Les gardes-frontières t’ont relâché : centre surpeuplé et paperasse. Tu es reparti.","Спонсора не нашлось: компании неохотно берут иностранцев. Попробуй через год.":"Aucun sponsor trouvé : les entreprises hésitent à embaucher des étrangers. Réessaie l’an prochain.","Инфаркт. Выжил":"Infarctus. Tu as survécu.","Инсульт. Долгое восстановление: заново учиться ходить и говорить.":"AVC. Une longue rééducation : réapprendre à marcher et à parler.","Тяжёлая пневмония. Месяц в постели.":"Pneumonie grave. Un mois au lit.","Туберкулёз. Полгода на таблетках из государственной клиники.":"Tuberculose. Six mois de traitement délivré par une clinique publique.","Диабет. Теперь лекарства и диета — каждый год и до конца жизни.":"Diabète. Désormais médicaments et régime, chaque année et à vie.","Дожди не пришли, урожай погиб. Семья ест один раз в день.":"La pluie n’est pas venue, la récolte est perdue. La famille ne mange qu’une fois par jour.","Малярия. Неделя жара; лекарства стоили как месяц еды.":"Paludisme. Une semaine de fièvre ; le traitement coûte autant qu’un mois de nourriture.","Денге после сезона дождей. Две недели в постели.":"Dengue après la saison des pluies. Deux semaines au lit.","Наводнение. Вода стояла в доме по колено.":"Inondation. L’eau arrivait aux genoux dans la maison.","Местная валюта снова упала. Накопления за год потеряли четверть.":"La monnaie locale a encore chuté. Les économies ont perdu un quart de leur valeur cette année.","Свет дают по несколько часов в день — уроки при фонарике.":"L’électricité ne vient que quelques heures par jour : les cours se font à la lampe.","Год подготовки к гаокао: уроки до ночи, без выходных. Этот экзамен решает почти всё.":"Une année de préparation au gaokao : cours jusqu’à la nuit, sans jours de repos. Cet examen oor":"{loc}-এর গ্রামে দিদার বাড়ি বেড়াতে গেলে। প্রথমবার নদী দেখলে আর ঠোঁট নীল হওয়া পর্যন্ত সাঁতার কাটলে।","mid":"জীবনে প্রথমবার সমুদ্রে বেড়াতে গেলে। পকেটে পকেটে বালি, আর কেউই বাড়ি ফিরতে চায় না।","rich":"সমুদ্রে পারিবারিক ছুটি: সুইমিং পুলওয়ালা হোটেল, স্মৃতির ছবি আর প্রতি সন্ধ্যায় আইসক্রিম।"},"5":{"poor":"কিন্ডারগার্টেন মানে পাড়ার সব বাচ্চার সঙ্গে খেলার মাঠ, আর পুরোনো কাপড়ে সেলাই করা একটা বল।","mid":"কিন্ডারগার্টেন: জীবনের প্রথম বন্ধু, পরিবারের জন্য প্রথম আঁকা ছবি, আর উৎসবের হাতের কাজ।","rich":"এমন কিন্ডারগার্টেন যেখানে ইংরেজি গান আর সুইমিং পুল আছে। প্রথম «সপ্তাহের তারকা» হওয়ার সার্টিফিকেট।"},"6":{"poor":"জন্মদিন: উপহার ছিল রঙিন পেনসিলের বাক্স, যেটা সারা বছর যত্ন করে রেখেছ। একটাও ভাঙোনি।","mid":"জন্মদিন: মাঠের বন্ধুরা, পিঠা, আর একটা বোর্ড গেম যেটা রাত পর্যন্ত খেলেছ।","rich":"জন্মদিন: অ্যানিমেশনওয়ালা একটা ট্যাবলেট, যার জন্য বাবা-মা অর্ধেক বছর টাকা জমিয়েছেন। সবাই উত্তেজিত।"},"7":{"poor":"স্কুলের প্রথম দিন। পোশাকটা বড় ভাইয়ের কাছ থেকে পাওয়া, জামাটা দুই সাইজ বড়। ব্যাপার নেই, বড় হতে হতে ঠিক হয়ে যাবে।","mid":"স্কুলের প্রথম দিন: ডাইনোসরের ছবিওয়ালা ব্যাগ, শিক্ষিকার জন্য ফুলের তোড়া, আর সারাদিনের গর্ব।","rich":"প্রথম শ্রেণি: নতুন ব্যাগ, চুম্বকওয়ালা পেনসিল বাক্স, আর স্কুলের গেটের সামনে তোলা ছবি যেটা মা দেয়ালে টাঙাবেন।"},"8":{"poor":"শহরের সার্কাসে প্রথমবার: ধুলো ভরা তাঁবু, আর এক জোকার যিনি মিষ্টি দিয়ে সবাইকে ঠকালেন।","mid":"চিড়িয়াখানায় বেড়ানো। বাঁদরের খাঁচার সামনে তুমি সবচেয়ে বেশি সময় দাঁড়িয়ে ছিলে।","rich":"চিড়িয়াখানা, তারপর ক্যাফেতে ডিনার। ওয়েটার জন্মদিনের ছেলে/মেয়েটির জন্য একটা মিষ্টি সারপ্রাইজ আনলেন।"},"9":{"poor":"এক সপ্তাহ জ্বর আর সর্দি। তিন দিন জ্বর ছিল, ওষুধ মা ধারে কিনেছেন। মা ঘুমাতে পারেননি, তবু সব কেটে গেল।","mid":"এক সপ্তাহ সর্দি: মা স্যুপ বানিয়ে দিতেন আর জোরে জোরে বই পড়ে শোনাতেন। রোগটাও প্রায় মজার লাগছিল।","rich":"এক সপ্তাহ সর্দি: বাড়িতে ডাক্তার, নির্দিষ্ট সময়ে কার্টুন, আর দিদার পাঠানো মিষ্টির স্তূপ।"},"10":{"poor":"প্রথম বন্ধু: ফাঁকা জমিতে তক্তা দিয়ে একটা ছোট ঘর বানিয়েছিলে। জীবনের সবচেয়ে গুরুত্বপূর্ণ গ্রীষ্ম।","mid":"প্রথম ক   if(l===1) return s.age>=12; if(l===2) return s.age>=16;
  if(l===3) return s.grit>=45&&s.money>=200&&s.age>=17;
  if(l===4) return s.know>=50&&(s.voc||s.edu>=2)&&s.age>=18;
  if(l===5) return s.edu>=3&&s.know>=55;
  return false;
}
function nextJob(s){for(let l=s.job+1;l<=5;l++) if(canJob(s,l)) return l;return s.job}
function career(s,F){
  if(s.retired||s.status==='student'||s.job===6) {if(s.job>=4)s.exp++;return}
  if((s.inSchool||s.uni>0)&&!F.includes('work')) return;
  let p=F.includes('work')?.32+s.conn/300+s.grit/400:(s.age>=18&&s.job===0?.55:.03);
  if(s.status==='seeker')p+=.15;
  if(s.talents.includes('trade')&&F.includes('work')) p+=.06;
  const n=nextJob(s);
  if(n>s.job&&chance(p)){s.job=n;log(s,TPL('newJob',s,{})||`Новая работа: ${jobName(s)}.`,'good')}
  if(s.job>=4) s.exp++;
}

/* --- school --- */
function school(s,F){
  const h=C[s.home];
  if(!home(s)) return;
  if(s.age===6){
    const p=Math.min(.99,h.school[s.decile]*(s.urban?1.04:.9)*(s.female&&s.decile<3?.88:1));
    if(chance(p)){s.inSchool=true;log(s,TPL('school',s,{})||`Ты пош${G(s,'ёл','ла')} в школу.`)}
    else{s.noSchool=true;log(s,TPL('schoolNoMoney',s,{urban:s.urban})||`На школу у семьи нет денег. Ты помогаешь ${s.urban?'маме торговать на рынке':'родителям в поле'}.`,'bad')}
  }
  if(s.inSchool&&s.age<18){s.know+=rand(2,3.4)*(s.talents.includes('math')?1.25:1)*(s.decile<=2?.85:1);s.eng+=s.urban?h.engS[1]:h.engS[0]}
  if(!s.inSchool&&s.age>=7&&s.age<16){s.health-=.6;s.grit+=.4;if(s.age>=10&&s.job===0)s.job=1}
  if(s.age===12&&s.inSchool){s.edu=1;pend(s,'secondary',{aff:chance(h.sec[s.decile])})}
  if(s.age===18&&s.inSchool){s.inSchool=false;s.edu=2;log(s,'Школа окончена.','good');pend(s,'after',{})}
  if(s.uni>0){
    if(!F.includes('study')&&chance(.4)){s.uni=0;log(s,'Без учёбы сессию не вытянуть — тебя отчислили.','bad')}
    else{s.know+=rand(3,6);s.uni--;if(s.uni===0){fx(s,'party');s.edu=3;log(s,'Диплом университета на руках.','key')}}
  }
  if(s.vocLeft>0){s.vocLeft--;s.know+=rand(1,3);if(!s.vocLeft){s.voc=true;log(s,'Ты получил рабочую специальность.','good')}}
}

/* --- money --- */
function economy(s,F){
  const c=C[s.live];
  if(s.age<18&&home(s)) return;
  const inc=income(s)*(F.includes('work')?1.12:1);
  const sp=s.married?s.spouseInc:0;
  let cost=c.cost+s.kids*c.kidCost;
  if(home(s)&&s.age<24&&!s.married) cost*=.45;
  const extra=Math.max(0,inc+sp-cost)*(home(s)?.78:.62);
  cost+=F.includes('save')?extra*.7:extra;
  if(s.uni>0&&!s.scholar) cost+=s.uniFee;
  s.lastNet=inc+sp-cost;
  s.money+=s.lastNet;
  if(s.money<0){s.money*=1.12;if(s.money<-c.cost*2){s.happy-=5;if(!s.debtWarn){s.debtWarn=1;log(s,'Долги растут быстрее доходов. Проценты съедают всё.','bad')}}}
}

/* --- abroad --- */
function arrive(s,status,dest){
  const d=C[dest];
  s.live=dest;s.dest=dest;s.status=status;s.statusYears=0;s.yrsAbroad=0;s.place=pick(d.cities);s.urban=true;
  s.job=status==='student'||status==='seeker'?0:(status==='temp'?(s.edu>=3&&s.eng>=60?4:2):(s.eng>=70?2:1));
  if(s.job===4&&!canJob(s,4))s.job=2;
  if(s.married) s.spouseInc=18000;
  s.happy+=10;fx(s,'flight');clampAll(s);
}
function toPR(s,t){fx(s,'party');s.status='pr';s.statusYears=0;log(s,TPL('toPR',s,{t:LGX(t)})||`${t} Теперь у тебя ${C[s.live].prName}: ${C[s.live].name} — твой дом.`,'key')}
function deport(s,t){
  fx(s,'sad');const from=C[s.live].name;
  s.live=s.home;s.status='home';s.place=pick(C[s.home].cities);s.job=1;s.happy-=15;s.statusYears=0;
  if(s.married) s.spouseInc=C[s.home].jobs[2];
  log(s,TPL('deport',s,{t:LGX(t),from,home:C[s.home].name})||`${t} Пришлось уехать из страны «${from}» и вернуться: ${C[s.home].name}.`,'key');
}
function abroad(s,F){
  const d=s.live;s.yrsAbroad++;s.statusYears++;
  if(s.status==='student'){
    if(!F.includes('study')&&!s.ausb&&chance(.35)){log(s,'Завалил сессию — год учёбы придётся повторить и оплатить.','bad');s.money-=7000}
    else s.studyLeft--;
    s.eng+=rand(2,4);
    if(s.studyLeft<=0){fx(s,'party');
      if(s.ausb){s.ausb=false;s.voc=true;s.status='temp';s.statusYears=0;s.job=4;log(s,'Ausbildung окончен! Немецкая специальность и рабочий вид на жительство.','key')}
      else{s.edu=4;s.status='grad';s.statusYears=0;s.job=1;log(s,TPL('diploma',s,{d})||`Диплом ${C[d].gen}! Дали право работать после учёбы.`,'key')}}
  } else if(s.status==='grad'){
    if(d==='US'){if(s.job>=4&&chance(.25)){s.status='temp';s.statusYears=0;log(s,'Работодатель выиграл для тебя лотерею H-1B. Рабочая виза на 3 года.','key')}else if(s.statusYears>=3)deport(s,'Время работы после учёбы вышло, а H-1B так и не выпала в лотерее.')}
    else if(d==='DE'){if(s.job>=2){s.status='temp';s.statusYears=0;log(s,'Нашёл работу — получил рабочий вид на жительство.','good')}else if(s.statusYears>=2)deport(s,'За полтора года после учёбы работу найти не удалось.')}
    else{if(s.statusYears>=1&&s.job>=4&&s.eng>=(d==='AU'?70:62)&&chance(.45))toPR(s,'Опыт в стране и язык сработали: пришло приглашение на ПМЖ.');else if(s.statusYears>=3)deport(s,'Разрешение на работу закончилось, а ПМЖ не дали.')}
  } else if(s.status==='seeker'){
    if(s.job>=2){s.status='temp';s.statusYears=0;log(s,'Работа найдена! Карта возможностей превращается в рабочую визу.','key')}
    else if(chance(.75))deport(s,'Карта возможностей закончилась, а работы так и нет.');
  } else if(s.status==='temp'){
    if(chance(.12)){if(chance(.5))log(s,'Работодатель закрылся, но ты быстро нашёл новый — виза сохранена.','bad');else return deport(s,'Работодатель закрылся, а без работы рабочая виза не действует.')}
    let p=0;
    if(d==='US'&&s.statusYears>=2&&s.job>=4)p=s.home==='IN'?.02:s.home==='CN'?.05:.15;
    if(d==='CA'&&s.statusYears>=2&&s.eng>=60&&s.job>=2)p=.08;
    if(d==='AU'&&s.statusYears>=2&&s.eng>=65&&s.job>=4)p=.15;
    if(d==='DE'&&s.statusYears>=2&&s.job>=2)p=.3;
    if(d==='UK'&&s.statusYears>=3&&s.job>=2)p=.2;
    if(chance(p))toPR(s,d==='US'?'Очередь на грин-карту наконец дошла.':'Тебе одобрили постоянное жительство.');
    else if(d==='US'&&s.home==='IN'&&s.statusYears===3&&!s.seen.queue){s.seen.queue=1;log(s,'Очередь на грин-карту для рождённых в Индии растягивается на десятилетия. Это реальность, а не баг.','info')}
  } else if(s.status==='undoc'){
    if(chance(d==='US'?.09:.08)){deport(s,'Проверка документов на работе — и депортация.');return}
    const reg=d==='DE'?(s.statusYears>=5&&s.job>=1&&s.eng>=45?.03:0):d==='US'?(s.statusYears>=8?.01:0):0;
    if(chance(reg)){s.status='temp';s.statusYears=0;fx(s,'party');log(s,d==='DE'?'Тебе дали право остаться: работа, язык и годы в стране сработали.':'Удалось легализоваться — спустя годы жизни в тени.','key')}
  } else if(s.status==='refugee'){
    if(s.statusYears>=(d==='US'?1:3)&&chance(d==='US'?.5:.35))toPR(s,'Защита одобрена окончательно.');
  } else if(s.status==='pr'){
    if(s.statusYears>=C[d].citYears&&s.eng>=50&&chance(.8)){fx(s,'party');fx(s,'citizen');s.status='cit';s.statusYears=0;log(s,TPL('citizen',s,{d})||`Ты гражданин${G(s,'','ка')} ${C[d].gen}. Новый паспорт открывает почти весь мир без виз.`,'key')}
  }
}

function runEvents(s,F){
  if(s.pending) return;
  let n=0;
  for(const e of shuffle(EVENTS)){
    if(n>=2) break;
    if(e.once&&s.seen[e.id]) continue;
    if(!e.when(s,F)||!chance(e.p(s))) continue;
    s.seen[e.id]=1;n++;
    const r=e.run(s,F);
    if(!s.alive)return;
    if(r&&r.id){s.pending={id:r.id,d:r.d||{}};break}
  }
}

function quietYear(s){
  if(!s.alive||s.pending)return;
  const g=G(s,'','а');
  const pool=QUIET.filter(q=>(q.repeat||!s.seen['q_'+q.id])&&q.ok(s));
  if(!pool.length||!chance(.7))return;
  const q=pool[Math.floor(rng()*pool.length)];
  if(q.chance&&!chance(q.chance))return;
  if(!q.repeat)s.seen['q_'+q.id]=1;
  let txt=q.t(s,g);const LQ=LANG!=='ru'&&(I18N_ALL[LANG]||{}).events;if(LQ&&LQ.quiet&&LQ.quiet[q.id])txt=PH(LQ.quiet[q.id],s);
  log(s,txt,q.happy<0?'bad':'good');
  if(q.f)fx(s,q.f);
  if(q.happy)s.happy+=q.happy;if(q.money)s.money+=q.money;if(q.health)s.health+=q.health;if(q.conn)s.conn+=q.conn;
}

function deathDate(s){if(!s.deathAt){const b=bornDate(s).getTime(),seed=(s.first[1].length*31+s.last[1].length*17+s.deathAge*7)%365;s.deathAt=b+(s.deathAge*365.25+seed)*864e5}return new Date(s.deathAt)}

function lifePath(s,W,H,pad){
  const h=s.hist&&s.hist.length?s.hist:[[0,s.startRung,0],[s.deathAge,s.rung,home(s)?0:1]];const maxA=Math.max(10,s.deathAge);
  const X=a=>pad.l+a/maxA*(W-pad.l-pad.r),Y=r=>pad.t+(10-r)/9*(H-pad.t-pad.b);
  const pts=h.map(p=>[X(p[0]),Y(p[1]),p[2]]);
  let line='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');
  let area=line+` L${pts[pts.length-1][0].toFixed(1)} ${Y(1)+8} L${pts[0][0].toFixed(1)} ${Y(1)+8} Z`;
  const abroad=[];let cur=null;pts.forEach(p=>{if(p[2]){if(!cur){cur=[];abroad.push(cur)}cur.push(p)}else cur=null});
  const peak=h.reduce((m,p)=>p[1]>m[1]?p:m,h[0]);
  return{line,area,abroad:abroad.map(seg=>'M'+seg.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')),X,Y,peak,end:h[h.length-1],maxA};
}

const vKey=k=>k==='rich'?'abroad':k==='back'||k==='undoc'?'up':k==='route'?'child':k;
const emptyAgg=()=>{const by={};HOMES.forEach(k=>by[k]={n:0,w:0,age:0,adult:0,adultAge:0,v:{}});return{n:0,w:0,age:0,by}};
function addLife(a,s){const v=verdict(s),b=a.by[s.home],k=vKey(v.k);a.n++;a.age+=s.deathAge;if(v.win)a.w++;b.n++;b.age+=s.deathAge;if(v.win)b.w++;b.v[k]=(b.v[k]||0)+1;if(s.deathAge>=5){b.adult++;b.adultAge+=s.deathAge}}
function mergeAgg(list){const a=emptyAgg();list.forEach(d=>{if(!d||!d.by)return;a.n+=d.n||0;a.w+=d.w||0;a.age+=d.age||0;HOMES.forEach(c=>{const x=d.by[c];if(!x)return;const b=a.by[c];b.n+=x.n||0;b.w+=x.w||0;b.age+=x.age||0;b.adult+=x.adult||0;b.adultAge+=x.adultAge||0;Object.entries(x.v||{}).forEach(([k,n])=>b.v[k]=(b.v[k]||0)+n)})});return a}
const Stats={players:null,model:emptyAgg(),modelTarget:2400,db:null,uid:null,
  async init(){
    try{const db=await window.claude?.use?.('db');if(!db)return;const user=await window.claude.use('user');this.db=db;this.uid=user?await user.id():null;
      const t=setTimeout(()=>{},10000);

    }catch(e){}
  },
  async record(s){if(!this.db||!this.uid)return;try{const ref=this.db.doc('lives/'+this.uid);const snap=await ref.get();const cur=snap.exists?snap.data():emptyAgg();
    const a=mergeAgg([cur]);addLife(a,s);await ref.set(JSON.parse(JSON.stringify(a)))}catch(e){}},
  runModel(){const step=()=>{for(let i=0;i<120&&this.model.n<this.modelTarget;i++){const s=newLife('fair');let g=0;

       <div class="kpis">${kpi(fmt(A.n),F().statsKpi.lived,src)}${kpi(pct(A.w,A.n)+'%',F().statsKpi.escaped,F().statsKpiSub.escaped)}${kpi(A.n?(A.age/A.n).toFixed(1):'—',F().statsKpi.avgLife,F().statsKpiSub.avgLife)}</div>

let LANG='ru';
function detectLang(){
  let saved=null;try{saved=localStorage.getItem('upborn.lang')}catch(e){}
  if(saved&&LANGS[saved])return saved;
  const list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||'en'];
  for(const raw of list){const code=String(raw||'').toLowerCase();const base=code.split('-')[0];if(base==='zh')return 'zh';if(LANGS[base])return base}
  return 'en';
}
const tr=()=>I18N[LANG]||I18N.en;
function applyLang(){
  document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';

  const nl=document.getElementById('homeBtn');if(nl)nl.textContent=tr().newlife;

  const t=I18N_ALL[LANG]||{},ct=t.ctry||{},rt=t.routes||{};
  for(const k in C){const x=(ct.home&&ct.home[k])||(ct.dest&&ct.dest[k]);Object.assign(C[k],ORIG.C[k],x||{})}
  for(const r of ROUTES){const o=ORIG.R[r.id],x=rt[r.id];r.name=x&&x.name||o.name;r.desc=x&&x.desc||o.desc}
  if(!ORIG.J)ORIG.J={home:JOBS.home.slice(),dest:JOBS.dest.slice()};
  const jb=ct.jobs||{};JOBS.home=jb.home||ORIG.J.home;JOBS.dest=jb.dest||ORIG.J.dest;
}
function setLang(code){

}

  function tr(s){
    if(!RX)return s;
    RX.lastIndex=0;
    return s.replace(RX,m=>DICT[m]!==undefined?DICT[m]:(NAMES.get(m)||m));
  }
  function walk(root){
    if(LANG==='ru'||!root)return;
    build();
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
      const p=n.parentNode&&n.parentNode.nodeName;
      return (p==='SCRIPT'||p==='STYLE'||p==='TEXTAREA')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    let n;const list=[];
    while((n=w.nextNode()))if(RX_CY.test(n.nodeValue))list.push(n);
    for(const t of list){const v=t.nodeValue,r=tr(v);if(r!==v)t.nodeValue=r;}
    root.querySelectorAll && root.querySelectorAll('[title],[aria-label]').forEach(el=>{for(const at of ['title','aria-label']){const v=el.getAttribute(at);if(v&&RX_CY.test(v)){const r=tr(v);if(r!==v)el.setAttribute(at,r)}}});
  }
  let queued=false;
  window.rtWalk=walk;
  const mo=new MutationObserver(()=>{
    if(LANG==='ru'||queued)return;
    queued=true;
    requestAnimationFrame(()=>{queued=false;walk(document.body)});
  });
  mo.observe(document.body,{childList:true,subtree:true,characterData:true});
  walk(document.body);
})();
</script>
